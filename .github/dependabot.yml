version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Sin este prefijo los mensajes de Dependabot no pasarian el hook
    # commit-msg al rebasear en local.
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Las piezas fragiles del harness llegan en un solo PR: si se rompen, se
      # rompen juntas y se revierten con un git revert.
      harness-de-calidad:
        patterns:
          - "com.diffplug.spotless:*"
          - "com.google.errorprone:*"
          - "com.uber.nullaway:*"
          - "org.jacoco:*"
          - "org.apache.maven.plugins:maven-enforcer-plugin"
          - "com.tngtech.archunit:*"
      testcontainers:
        patterns:
          - "org.testcontainers:*"
    ignore:
      # Sus majors cambian flags y la sintaxis de -XepOpt: son migraciones con
      # trabajo, no bumps. Se hacen a mano, cuando uno decide.
      - dependency-name: "com.google.errorprone:error_prone_core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.uber.nullaway:nullaway"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
